server.port=8080
spring.application.name=spring-student-management-system
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# PostgreSQL configuration. Docker Compose overrides these values with the
# postgres service hostname; the defaults support local backend development.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/student_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Baseline existing development databases. New schema changes belong in
# numbered migrations under db/migration.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# MVP single-superuser credentials. Override these in Docker/environment variables.
app.superuser.username=${APP_SUPERUSER_USERNAME:admin}
app.superuser.password=${APP_SUPERUSER_PASSWORD:change-me}

# Docker health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
