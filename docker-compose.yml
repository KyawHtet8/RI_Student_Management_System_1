services:
  # ==========================================
  # Frontend Service (React SPA + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    container_name: sms-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sms-network

  # ==========================================
  # Optional: Spring Boot Backend Service
  # Uncomment when running full-stack locally with Docker Compose
  # ==========================================
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: sms-backend
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - SPRING_PROFILES_ACTIVE=prod
  #     - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/student_db
  #     - SPRING_DATASOURCE_USERNAME=postgres
  #     - SPRING_DATASOURCE_PASSWORD=postgres
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - sms-network

  # ==========================================
  # Optional: PostgreSQL Database
  # ==========================================
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: sms-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: student_db
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres -d student_db"]
  #     interval: 10s
